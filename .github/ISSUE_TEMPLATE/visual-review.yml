name: Visual review
description: Answer four short questions about five anonymous dashboard candidates.
title: "Visual review: "
body:
  - type: dropdown
    id: strongest
    attributes:
      label: Which candidate is easiest to read?
      options: [Candidate A, Candidate B, Candidate C, Candidate D, Candidate E]
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: What made it easiest to read?
      description: Mention contrast, text size, spacing, or layout. One sentence is enough.
    validations:
      required: true
  - type: dropdown
    id: information-find
    attributes:
      label: Which candidate makes the main information easiest to find?
      options: [Candidate A, Candidate B, Candidate C, Candidate D, Candidate E, No meaningful difference]
    validations:
      required: true
  - type: textarea
    id: problems
    attributes:
      label: What is one problem you noticed?
      description: Name the candidate and view, for example: Candidate C, mobile view, content is too narrow.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Why would you choose your strongest candidate?
      description: Mention the practical reason, not the tool or creator. For example: easier to scan or clearer action.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional detail for follow-up
      description: Name an exact candidate and view, describe what you saw, and say what you would change. Example: Candidate C, mobile view, the navigation uses most of the screen and the text becomes too narrow to read.
  - type: textarea
    id: viewing-context
    attributes:
      label: Optional viewing context
      description: For example, phone or desktop screen, low vision, color-vision difference, browser zoom, or dark-room viewing.
  - type: checkboxes
    id: reviewed
    attributes:
      label: Review scope
      options:
        - label: I looked through all five candidate sections.
          required: true
